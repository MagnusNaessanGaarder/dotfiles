# Author: Magnus Naessan Gaarder
#
# Second line of defence: runs the same tools/check.sh as the local pre-push hook,
# for pushes made from a machine where the hook isn't enabled. Blocks .env files,
# tokens, plain-text passwords (also anywhere in the git history), broken syntax.
name: integrity check

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  GITLEAKS_VERSION: 8.30.1
  GITLEAKS_SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history, so gitleaks can scan every commit
      - name: Install checkers
        run: |
          sudo apt-get update -q && sudo apt-get install -y -q lua5.4 jq shellcheck
          curl -fsSL -o gitleaks.tar.gz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  gitleaks.tar.gz" | sha256sum -c -
          tar -xzf gitleaks.tar.gz gitleaks && sudo mv gitleaks /usr/local/bin/ && rm gitleaks.tar.gz
      - name: Run tools/check.sh
        run: bash tools/check.sh
